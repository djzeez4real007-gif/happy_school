version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter


    

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  intl: ^0.20.2
  share_plus: ^11.1.0
  pdf: ^3.11.1
